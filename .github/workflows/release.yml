# Builds the Windows package on every pull request, and publishes it as a GitHub release
# when a merge lands on main with a package.json version that has no release tag yet.
name: Release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-package:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5

      - name: Read the package version
        id: version
        run: |
          $package = Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json
          # -AsHashtable: the lock file's packages map has an empty-string key, which ConvertFrom-Json otherwise rejects.
          $lock = Get-Content -LiteralPath package-lock.json -Raw | ConvertFrom-Json -AsHashtable
          if ($lock['version'] -ne $package.version) { throw "package-lock.json version $($lock['version']) does not match package.json version $($package.version)." }
          $tag = "v$($package.version)"
          $existing = git ls-remote --tags origin "refs/tags/$tag"
          $publish = ('${{ github.event_name }}' -ne 'pull_request') -and [string]::IsNullOrWhiteSpace($existing)
          "version=$($package.version)" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
          "tag=$tag" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
          "publish=$($publish.ToString().ToLowerInvariant())" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
          "prerelease=$(($package.version -like '*-*').ToString().ToLowerInvariant())" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
          if (-not $publish -and '${{ github.event_name }}' -ne 'pull_request') { Write-Host "Release $tag already exists; building only." }

      - name: Download pinned runtimes and install dependencies
        run: ./scripts/setup-windows.ps1

      - name: Run tests with the bundled Node runtime
        run: |
          & './runtime/node.exe' --test 'tests/*.test.mjs'
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed.' }

      - name: Build the Windows package
        run: ./scripts/build-windows.ps1 -PackageName "Theater Simple Windows ${{ steps.version.outputs.version }}"

      - name: Check the launcher replaces a copy running from another folder
        run: |
          $package = (Get-Item -LiteralPath "dist/Theater Simple Windows ${{ steps.version.outputs.version }}").FullName
          $other = Join-Path $env:RUNNER_TEMP 'other-copy'
          Copy-Item -LiteralPath $package -Destination $other -Recurse
          $ownerOf43120 = { $listener = Get-NetTCPConnection -LocalPort 43120 -State Listen -ErrorAction SilentlyContinue | Select-Object -First 1; if ($listener) { (Get-CimInstance Win32_Process -Filter "ProcessId = $($listener.OwningProcess)").CommandLine } }
          $oldServer = Start-Process -FilePath (Join-Path $other 'runtime\node.exe') -ArgumentList @('"' + (Join-Path $other 'server.mjs') + '"') -WorkingDirectory $other -WindowStyle Hidden -PassThru
          for ($attempt = 0; $attempt -lt 40 -and -not (& $ownerOf43120); $attempt++) { Start-Sleep -Milliseconds 250 }
          if (-not ((& $ownerOf43120) -like "*$other*")) { throw 'The other copy did not start.' }
          foreach ($run in 1, 2) {
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $package 'Start Theater.ps1') -NoBrowser
            if ($LASTEXITCODE -ne 0) { throw "Start Theater.ps1 failed on run $run." }
            $commandLine = & $ownerOf43120
            if (-not ($commandLine -like "*$(Join-Path $package 'server.mjs')*")) { throw "Run ${run}: port 43120 is served by: $commandLine" }
          }
          if (-not $oldServer.HasExited) { throw 'The other copy is still running.' }
          $state = Invoke-RestMethod -Uri 'http://127.0.0.1:43120/api/state'
          if ($state.version -ne '${{ steps.version.outputs.version }}') { throw "Unexpected version $($state.version)." }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $package 'Stop Theater.ps1')
          for ($attempt = 0; $attempt -lt 20 -and (& $ownerOf43120); $attempt++) { Start-Sleep -Milliseconds 250 }
          if (& $ownerOf43120) { throw 'Stop Theater.ps1 did not stop the server.' }
          Write-Host "Launcher replaced the other copy and reused its own server; version $($state.version)."

      - name: Keep the package as a workflow artifact
        uses: actions/upload-artifact@v5
        with:
          name: Theater Simple Windows ${{ steps.version.outputs.version }}
          path: |
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error

      - name: Publish the GitHub release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $arguments = @('release', 'create', '${{ steps.version.outputs.tag }}', '--target', '${{ github.sha }}', '--title', 'Theater Simple ${{ steps.version.outputs.version }}', '--generate-notes')
          if ('${{ steps.version.outputs.prerelease }}' -eq 'true') { $arguments += '--prerelease' }
          $arguments += Get-ChildItem -LiteralPath dist -File | Where-Object { $_.Name -like '*.zip' -or $_.Name -like '*.zip.sha256' } | ForEach-Object { $_.FullName }
          & gh @arguments
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed.' }
