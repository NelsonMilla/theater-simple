<!doctype html><html lang="en"><meta charset="utf-8"><title>Theater • Presentation Test</title><style>
html,body{margin:0;height:100%;background:#f4f0e7;color:#132735;font-family:"Segoe UI",sans-serif}main{padding:8vh 8vw}.tag{color:#087765;letter-spacing:4px;font-size:20px}h1{font-size:clamp(38px,6vw,90px);font-weight:500;max-width:1000px;line-height:1.08}p{font-size:clamp(18px,2vw,34px);max-width:1000px}footer{position:fixed;bottom:4vh;color:#55717d;font-size:18px}kbd{padding:4px 10px;border:1px solid #9badb2;border-radius:5px}</style><main><span class="tag">PRESENTATION CHECK</span><h1 id="title">One stage.<br>Two audiences.</h1><p id="body">A sample deck for testing your presentation capture, projector, and Zoom screen share.</p><footer><kbd>←</kbd> <kbd>→</kbd> Change test slide · <span id="num">1</span> / 3</footer></main><script>let i=0;const slides=[['One stage.<br>Two audiences.','A sample deck for testing your presentation capture, projector, and Zoom screen share.'],['Present your way.','Share through Zoom, play a local PowerPoint or PDF, or capture another application.'],['Ready for rehearsal.','Check the actual projector, camera, caption language, and audio routing before the event.']];onkeydown=e=>{if(!['ArrowLeft','ArrowRight',' '].includes(e.key))return;i=(i+(e.key==='ArrowLeft'?2:1))%3;document.getElementById('title').innerHTML=slides[i][0];document.getElementById('body').textContent=slides[i][1];document.getElementById('num').textContent=i+1;};</script></html>
