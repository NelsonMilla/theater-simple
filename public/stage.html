<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Theater Simple · Projector</title><link rel="stylesheet" href="/style.css"><style>
html,body{width:100%;height:100%;overflow:hidden;background:#000}.stage-layout{height:100%;width:100%;display:flex;align-items:center;justify-content:center}.program{border-radius:0;aspect-ratio:auto;width:100%;height:100%;container-type:size}.caption-band{height:19%;min-height:19%;padding:1% 4%}.caption-text{font-size:min(4.5vh,3.8vw);line-height:1.35;max-height:2.7em;font-weight:600}.program-message strong{font-size:min(6vw,10vh)}.program-message>span:last-child{font-size:min(2vw,3vh)}.stage-symbol{font-size:4vh;width:8vh;height:8vh;border-radius:2vh}.stage-tools{position:fixed;z-index:10;left:50%;top:16px;transform:translateX(-50%);display:flex;gap:12px;align-items:center;padding:12px 16px;border:1px solid #668071;border-radius:12px;background:#132e26f2;box-shadow:0 8px 25px #0004;color:#e7efdc;max-width:95vw;transition:opacity .3s}.stage-tools p{margin:0;font-size:12px;line-height:1.5;min-width:0}.stage-tools button{background:#e8ddaf;color:#1e3e30;flex-shrink:0}.stage-tools.faded{opacity:0;pointer-events:none}#stage-warning{position:fixed;z-index:11;bottom:20px;left:50%;transform:translateX(-50%);background:#9d402e;color:white;padding:10px 15px;border-radius:7px;font-size:13px;text-align:center;max-width:90vw}.visual-area>video{height:100%;width:100%}.camera-inset{max-width:26%;max-height:30%}
</style></head><body><div class="stage-layout"><div id="program" class="program" data-mode="holding"><div class="visual-area"><video id="stage-video" autoplay muted playsinline></video><canvas id="stage-pdf" class="pdf-page" role="img" aria-label="PDF presentation page" hidden></canvas><div id="stage-placeholder" class="program-message"><span class="stage-symbol">T</span><strong>Welcome.</strong><span>The presentation will begin shortly.</span></div><video id="stage-camera" class="camera-inset" autoplay muted playsinline hidden></video></div><div id="stage-captions" class="caption-band" hidden><div id="stage-caption-text" class="caption-text"></div></div></div></div><div id="stage-tools" class="stage-tools"><p>Drag this window to the projector display, then enter full screen.</p><button id="fullscreen-button" class="button">Full screen</button></div><div id="stage-warning" role="status" hidden></div><script type="module" src="/stage.js"></script></body></html>
